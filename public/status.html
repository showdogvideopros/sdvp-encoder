<style>
:root{--teal:#0d6d70;--teal2:#0a4f52;--gold:#c9a227;--ink:#15302f;--bg:#f4f7f6;--line:#d8e2e0;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Oswald,system-ui,sans-serif;font-size:18px;line-height:1.5}
header{background:var(--teal);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
header h1{font-family:'Playfair Display',Georgia,serif;font-size:29px;margin:0;font-weight:600}
.sp{flex:1}
.ctl{display:flex;align-items:center;gap:8px;font-size:19px}
select{font-family:inherit;font-size:18px;padding:6px 10px;border-radius:5px;border:0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--gold);display:inline-block}
a.nav{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.5);padding:6px 15px;border-radius:16px;font-size:16px}
a.nav:hover{background:rgba(255,255,255,.14)}
main{padding:22px;max-width:1400px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:9px;padding:20px 22px;margin-bottom:18px}
.card h2{font-size:22px;margin:0 0 4px;font-weight:600}
.meta{font-size:17px;color:#3f5b59;margin-bottom:12px}
.runline{padding:11px 14px;margin-bottom:7px;border:1px solid #cfe0de;border-radius:8px;background:#fbfdfd;cursor:pointer;font-size:17px;color:#15302f}
.runline:hover{background:#f0f7f6;border-color:#9ec4c0}
.runline.bad{border-left:4px solid #b4453c}
.bar{height:26px;background:#e6eeec;border-radius:13px;overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--gold));transition:width .4s}
.stats{font-size:18px;color:#2c4a48;display:flex;gap:24px;flex-wrap:wrap}
.chips{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:17px;padding:6px 14px;border-radius:16px;border:1px solid transparent}
.c-STORED{background:#e3f3e6;color:#1d6b33;border-color:#b6dcc0}
.c-VERIFIED{background:#e3f3e6;color:#1d6b33;border-color:#b6dcc0}
.c-ENCODED{background:#fdf3d6;color:#8a6d10;border-color:#eddba1}
.c-PLANNED{background:#fdf3d6;color:#8a6d10;border-color:#eddba1}
.c-SKIPPED{background:#e5eef7;color:#2c5a86;border-color:#bcd4e8}
.c-EXISTS{background:#e5eef7;color:#2c5a86;border-color:#bcd4e8}
.c-FAILED{background:#fbe4e4;color:#96231f;border-color:#efbdbb}
.phase{font-size:17px;font-weight:600;letter-spacing:.08em;padding:6px 14px;border-radius:5px;background:#e2e8e7;color:#46605e;display:inline-block;vertical-align:middle}
.phase.QUEUED{background:#e2e8e7;color:#46605e}
/* UNSTARTED: a stopped run's films that will never run. Deliberately NOT the
   same grey as QUEUED - queued means "waiting to start", and these never will.
   Struck through so the eye reads "cancelled", not "pending". */
.phase.UNSTARTED{background:#efe6ee;color:#6b4a66;text-decoration:line-through;
                 text-decoration-thickness:1px}
.phase.FETCHING{background:#f7e6b0;color:#6b5310}
.phase.PROBING{background:#f2d98a;color:#6b5310}
.phase.PLANNING{background:#ecc95f;color:#5c4708}
.phase.ENCODING{background:#c9a227;color:#2b2101}
.phase.VERIFYING{background:#a8ad3a;color:#22260a}
.phase.UPLOADING{background:#6da84f;color:#ffffff}
.phase.CLEANING{background:#3d8a44;color:#ffffff}
.phase.DONE{background:#1d6b33;color:#ffffff}
.phase.FAILED{background:#96231f;color:#ffffff}
@keyframes sdvppulse{0%{opacity:1}50%{opacity:.55}100%{opacity:1}}
.phase.FETCHING,.phase.PROBING,.phase.PLANNING,.phase.ENCODING,.phase.VERIFYING,.phase.UPLOADING,.phase.CLEANING{animation:sdvppulse 1.6s ease-in-out infinite}
.err{margin-top:12px;font-size:18px;background:#fbe4e4;color:#8a1f1b;padding:11px 14px;border-radius:6px}
.empty{text-align:center;color:#5d7472;padding:70px 0;font-size:21px}
.reason{font-size:16px;color:#4d6462;margin-top:9px}
table.r{width:100%;border-collapse:collapse;margin-top:14px;font-size:17px}
table.r td,table.r th{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.r th{color:#2c4a48;font-weight:400;font-size:16px}
.qual{margin-top:12px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.qthumb{width:132px;height:auto;border:1px solid var(--line);border-radius:6px;cursor:pointer;display:block;background:#e6eeec}
.qthumb:hover{border-color:var(--teal)}
.qlab{font-size:15px;color:#4d6462;text-align:center;margin-top:3px}
.qbtn{font-family:inherit;font-size:17px;padding:7px 15px;border-radius:16px;border:1px solid #b6dcc0;background:#e3f3e6;color:#1d6b33;cursor:pointer}
.qbtn.bad{background:#fbe4e4;color:#96231f;border-color:#efbdbb}
.qbtn.warn{background:#fdf3d6;color:#8a6d10;border-color:#eddba1}
.rbtn{font-family:inherit;font-size:17px;padding:6px 16px;border-radius:16px;border:1px solid;cursor:pointer;margin-left:14px;vertical-align:middle;letter-spacing:.04em}
.rbtn.pass{background:#e3f3e6;color:#1d6b33;border-color:#b6dcc0}
.rbtn.warn{background:#fdf3d6;color:#8a6d10;border-color:#eddba1}
.rbtn.fail{background:#fbe4e4;color:#96231f;border-color:#efbdbb}
.rbtn:hover{border-color:var(--teal)}
.hbtn{font-family:inherit;font-size:15px;font-weight:600;letter-spacing:.09em;padding:6px 15px;
      border-radius:16px;border:1px solid;cursor:pointer;margin-left:8px}
.hbtn.stop{background:#fdf3d6;color:#8a6d10;border-color:#eddba1}
.hbtn.abort{background:#fbe4e4;color:#96231f;border-color:#efbdbb}
.hbtn:hover{filter:brightness(.95)}
.hbtn[disabled]{opacity:.45;cursor:default}
.cbtn{font-family:inherit;font-size:17px;padding:9px 20px;border-radius:18px;border:1px solid;
      cursor:pointer;margin-right:12px}
.cbtn.go{background:#fbe4e4;color:#96231f;border-color:#efbdbb}
.cbtn.no{background:#e2e8e7;color:#46605e;border-color:#d8e2e0}
table.rep{width:100%;border-collapse:collapse;font-size:17px}
table.rep td,table.rep th{padding:10px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.rep th{color:#2c4a48;font-weight:400;font-size:16px}
.vd{font-size:15px;font-weight:600;letter-spacing:.07em;padding:4px 11px;border-radius:5px;display:inline-block;white-space:nowrap}
.vd.PASS{background:#e3f3e6;color:#1d6b33}
.vd.CHECK{background:#fdf3d6;color:#8a6d10}
.vd.FAIL{background:#fbe4e4;color:#96231f}
.vd.NA{background:#e2e8e7;color:#46605e}
.fix{font-size:15px;color:#4d6462;margin-top:5px;line-height:1.45}
.dup{background:#fdf3d6}
.qbtn:hover{border-color:var(--teal)}
#sdvpModal{position:fixed;inset:0;background:rgba(10,49,48,.82);display:none;align-items:center;justify-content:center;padding:26px;z-index:99}
#sdvpModal.on{display:flex}
#sdvpBox{background:#fff;border-radius:10px;padding:20px 22px;max-width:96vw;max-height:94vh;overflow:auto}
#sdvpBox h3{font-family:'Playfair Display',Georgia,serif;font-size:24px;margin:0 0 12px;font-weight:600;color:var(--ink)}
#sdvpBox img{max-width:92vw;max-height:78vh;display:block;border-radius:5px}
#sdvpClose{float:right;font-family:inherit;font-size:17px;padding:6px 15px;border-radius:5px;border:1px solid var(--line);background:#f4f7f6;color:var(--ink);cursor:pointer;margin-left:16px}
</style></head><body>
<header>
  <h1>SDVP Encoder</h1>
  <a class="nav" href="/jobs">&larr; jobs</a>
  <span class="sp"></span>
  <span class="ctl"><span class="dot" id="dot"></span><span id="stamp">—</span></span>
  <span class="ctl" id="stopwrap" style="display:none">
    <button class="hbtn stop"  id="btnStop"  onclick="askStop(false)">STOP</button>
    <button class="hbtn abort" id="btnAbort" onclick="askStop(true)">ABORT</button>
  </span>
  <span class="ctl">refresh
    <select id="iv">
      <option value="1000">1s</option>
      <option value="2000" selected>2s</option>
      <option value="5000">5s</option>
      <option value="30000">30s</option>
      <option value="0">paused</option>
    </select></span>
</header>
<main id="main"><div class="empty">connecting…</div></main>
<div id="sdvpModal"><div id="sdvpBox"><button id="sdvpClose">close</button><h3 id="sdvpTitle"></h3><div id="sdvpBody"></div></div></div>
<script>
var timer=null;
var LAST=null;
// Verdicts come from the daemon, computed in ONE place from the record, so the
// button and the report can never disagree. Null until the first fetch lands;
// a button with no verdict renders neutral rather than guessing.
var VERDICTS=null;   // newest state the page fetched; the run report compares against it
// REMAINING TIME on a live run. Projected from THIS run's own rate rather
// than from historical averages, so it needs no rate table and gets sharper
// with every film that finishes. Bytes are the unit of work: encode time
// tracks duration, duration tracks bytes on this material (masters measure
// 10.32-10.43 Mbps across 61 films), and skipped films contribute nothing to
// either side, which is why skips need no special handling.
// Silent until at least one film is done - a projection from a single film in
// progress would swing wildly and teach the reader to ignore it.
function remaining(r){
  if(!r||r.finished_at||!r.started_at)return '';
  var items=r.items||[];
  // ⛔ A QUEUED FILM HAS NO BYTE COUNT. [MEASURED 2026-08-20, run 30] The size
  // is written when the daemon FETCHES a film, not when the run is built - so
  // fourteen queued films read as zero work and the first version projected
  // "4 min left" on a 47 GB run. If ANY unfinished film lacks a size, bytes
  // cannot measure the remaining work and we fall back to counting FILMS.
  // Less accurate, never absurd. A figure that degrades gracefully beats one
  // that lies confidently at 3 AM.
  // ⛔ NO FALLBACK BY FILE COUNT. [MEASURED 2026-08-20, run 30] Counting films
  // treats a 3-minute BRACE CLASS as equal to a 149-minute BITCH CLASSES, and
  // this run began with its shortest film - by film count it read "0.7 h left"
  // when the true answer was hours. Both a byte projection with missing sizes
  // and a film-count projection were confidently wrong in the same direction.
  // If the sizes are not all known, SAY NOTHING. Silence is honest; a wrong
  // number read at 3 AM is not.
  var sized=true;
  items.forEach(function(it){
    if(it.phase==='DONE'||it.phase==='FAILED')return;
    if(!((it.probe&&it.probe.source_bytes)||it.bytes))sized=false;
  });
  if(!sized)return '';
  var doneB=0,leftB=0,anyDone=false;
  items.forEach(function(it){
    var b=((it.probe&&it.probe.source_bytes)||it.bytes||0);
    if(!b)return;
    if(it.phase==='DONE'||it.phase==='FAILED'){ doneB+=b; anyDone=true; }
    else if(it.phase==='QUEUED'){ leftB+=b; }
    else {
      // in flight: credit the fraction its progress bar reports - ACROSS ALL
      // PASSES. ⛔ [MEASURED 2026-08-23, run 41] Each output is its own ffmpeg
      // run, so the bar fills, RESETS TO ZERO and fills again. The projection
      // read that reset as the film losing 98% of its progress and reported
      // 13 hours left on a run with about one hour to go. Overall progress is
      // the passes already ENCODED plus the fraction of the live one.
      // ⚠ Passes are weighted EQUALLY and they are not equal - an HEVC pass
      // costs more than an H.264 pass of the same film. Approximate on
      // purpose; a weighting needs runs to derive it from.
      var pct=Math.max(0,Math.min(100,(it.progress&&it.progress.pct)||0));
      var outs=it.outputs||[];
      if(outs.length>1 && it.phase==='ENCODING'){
        // WEIGHTED BY MEASURED COST, not 50/50. [MEASURED 2026-08-24, run 45,
        // 10 films spanning 16-133 min] the H.264 pass is 44% of a film's encode
        // time and HEVC 56%. Treating them as equal made the estimate read ~16%
        // optimistic mid-HEVC, because the harder pass was credited as half done.
        var W={h264:0.44, hevc:0.56};
        var tot=0, got=0;
        outs.forEach(function(o){
          var w=W[o.codec]!=null?W[o.codec]:(1/outs.length);
          tot+=w;
          var rs=o.rungs||[];
          var anyPlanned=rs.some(function(x){return x.state==='PLANNED';});
          if(o.encoding) got+=w*(pct/100);
          else if(rs.length && !anyPlanned) got+=w;
        });
        pct = tot>0 ? (got/tot)*100 : pct;
      }
      doneB+=b*pct/100; leftB+=b*(1-pct/100);
    }
  });
  // ⭐ A SINGLE-FILM RUN HAS NO FINISHED FILM TO MEASURE FROM, and that is
  // exactly when the figure is wanted - one 90-minute master, nothing else in
  // the run, no way to say how long is left. [MEASURED 2026-08-21] the guard
  // below required a completed film, so every single-film run stayed silent
  // from start to finish.
  //
  // The film in flight is its own evidence: its progress percentage against
  // elapsed time is a rate, and on ONE long film it is arguably a better rate
  // than averaging across films of different lengths.
  //
  // ⛔ BUT AN EARLY PERCENTAGE SWINGS. The original exclusion was right to be
  // wary. So this speaks only after a minute of work AND 5% progress - below
  // that the reading is noise wearing a number's clothes, and silence is the
  // honest answer.
  if(!anyDone && doneB && leftB){
    var el0=(Date.now()-new Date(r.started_at).getTime())/1000;
    var frac=doneB/(doneB+leftB);
    if(el0>=60 && frac>=0.05){
      var sl=el0/frac*(1-frac);
      if(isFinite(sl) && sl>0){
        var w0=sl<3600?(Math.round(sl/60)+' min'):((sl/3600).toFixed(1)+' h');
        var d0=new Date(Date.now()+sl*1000);
        return ' \u00b7 ~'+w0+' left, done about '+
               d0.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
      }
    }
    return '';
  }
  if(!anyDone||!doneB||!leftB)return '';
  var elapsed=(Date.now()-new Date(r.started_at).getTime())/1000;
  if(elapsed<60)return '';
  var secLeft=elapsed/doneB*leftB;
  if(!isFinite(secLeft)||secLeft<=0)return '';
  var w=secLeft<3600?(Math.round(secLeft/60)+' min'):((secLeft/3600).toFixed(1)+' h');
  var done=new Date(Date.now()+secLeft*1000);
  return ' \u00b7 ~'+w+' left, done about '+done.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})
    ;
}
function fmt(s){if(s==null)return'—';if(s<90)return s.toFixed(0)+'s';return (s/60).toFixed(1)+' min';}
function mb(b){if(b==null)return'—';return b>=1e9?(b/1e9).toFixed(2)+' GB':(b/1e6).toFixed(1)+' MB';}
function esc(t){return String(t==null?'':t).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function rungRow(o){
  var h='<table class="r"><tr><th>rung</th><th>codec</th><th>state</th><th>size</th><th>Mbps</th><th>upload</th><th>note</th></tr>';
  o.rungs.forEach(function(r){
    h+='<tr><td>'+r.height+'p</td><td>'+esc(o.codec)+'</td><td><span class="chip c-'+esc(r.state)+'">'+esc(r.state)+'</span></td>'
      +'<td>'+mb(r.bytes)+'</td><td>'+(r.verify&&r.verify.mbps!=null?r.verify.mbps.toFixed(2):'—')+'</td>'
      +'<td>'+(r.upload_mbps!=null?r.upload_mbps.toFixed(0)+' Mbps':'—')
      +(r.checksum_match===true?' ✓':(r.checksum_match===false?' ✗':''))+'</td>'
      +'<td>'+esc(r.reason||'')+'</td></tr>';
  });
  return h+'</table>';
}
function card(it){
  var p=it.progress||{};
  var h='<div class="card"><h2>'+esc(it.name||'(fetching…)')+' <span class="phase '+esc(it.phase)+'">'+esc(it.phase)+'</span></h2>';
  h+='<div class="meta">'+esc(it.batch)+' &middot; '+mb(it.bytes)+(it.probe?' &middot; '+it.probe.width+'&times;'+it.probe.height+' '+esc(it.probe.video_codec)+' &middot; '+(it.probe.duration_s/60).toFixed(1)+' min':'')+'</div>';
  // NAME THE CODEC AND THE PASS. Each output is a SEPARATE ffmpeg run - the
  // three H.264 rungs share one decode, then HEVC runs again from scratch. The
  // bar therefore fills, resets to zero and fills again, and without this the
  // reader has no way to tell which pass they are watching.
  var lbl = esc(p.label||'');
  var outs = it.outputs||[], live = -1;
  for (var oi=0; oi<outs.length; oi++) if (outs[oi].encoding) live = oi;
  if (live >= 0 && lbl === 'encoding')
    lbl = 'encoding ' + esc(outs[live].codec) +
          (outs.length > 1 ? '  \u00b7  pass ' + (live+1) + ' of ' + outs.length : '');
  h+='<div style="font-size:16px;color:#3f5b59;margin-top:6px">'+lbl+'</div>';
  h+='<div class="bar"><i style="width:'+(p.pct||0).toFixed(1)+'%"></i></div>';
  h+='<div class="stats"><span>'+(p.pct||0).toFixed(0)+' percent</span><span>speed '+(p.speed_x||0).toFixed(2)+'x</span><span>eta '+fmt(p.eta_s)+'</span>';
  if(it.timings){var t=it.timings;h+='<span>fetch '+fmt(t.fetch_s)+'</span><span>encode '+fmt(t.encode_s)+'</span><span>verify '+fmt(t.verify_s)+'</span><span>upload '+fmt(t.upload_s)+'</span>';}
  h+='</div>';
  var chips='';
  (it.outputs||[]).forEach(function(o){o.rungs.forEach(function(r){
    chips+='<span class="chip c-'+esc(r.state)+'">'+r.height+'p '+esc(o.codec)+'</span>';});});
  if(chips)h+='<div class="chips">'+chips+'</div>';
  (it.outputs||[]).forEach(function(o){h+=rungRow(o);});
  var q=it.quality||null;
  if(q&&((q.sheets&&q.sheets.length)||q.audio)){
    var qh='';
    (q.sheets||[]).forEach(function(sh){
      if(!sh.served)return;
      var u='/sheet/'+encodeURIComponent(sh.served);
      qh+='<div><img class="qthumb" src="'+u+'" alt="'+esc(sh.codec)+' contact sheet"'
        +' onclick="showSheet(this.src,\''+esc(it.name).replace(/'/g,'')+' \u00b7 '+esc(sh.codec)+'\')">'
        +'<div class="qlab">'+esc(sh.codec)+' &middot; from '+sh.from_height+'p</div></div>';
    });
    if(q.audio){
      var a=q.audio;
      var rec=a.recorded||{};
      var lv=(rec.rms_db&&rec.rms_db.length)?rec.rms_db.map(function(x){return x.toFixed(1);}).join(' / ')+' dB':'';
      qh+='<button class="qbtn'+(a.ok?'':' bad')+'" onclick=\'showAudio('+JSON.stringify(a).replace(/'/g,'&#39;')+')\'>'
        +'audio '+(a.ok?'OK':'CHECK')+(lv?' &middot; '+lv:'')+'</button>';
    }
    if(qh)h+='<div class="qual">'+qh+'</div>';
  }
  if(it.error)h+='<div class="err">'+esc(it.error)+'</div>';
  if(it.scratch_retained)h+='<div class="reason">scratch retained for inspection</div>';
  return h+'</div>';
}
var LAST_STATE=null;
function draw(s){
  LAST_STATE=s;
  LAST=s;   // the report compares the record against exactly this snapshot
  // The stop controls exist only while a run is in flight. A stop button with
  // nothing to stop is clutter, and clutter in that corner trains the eye to
  // skip it - which is the last thing wanted in an emergency.
  (function(){
    var live=(s.runs||[])[0];
    var running=!!(live && !live.finished_at);
    var w=document.getElementById('stopwrap');
    if(w)w.style.display=running?'':'none';
    var up=running && (live.items||[]).some(function(x){return x.phase==='UPLOADING';});
    var ab=document.getElementById('btnAbort');
    if(ab){
      ab.disabled=up;
      ab.title=up?'An upload is in flight - it must finish first. Use STOP.':'';
    }
  })();
  var m=document.getElementById('main');
  document.getElementById('stamp').textContent=new Date(s.updated_at).toLocaleTimeString();
  var runs=s.runs||[];
  if(!runs.length){m.innerHTML='<div class="empty">no runs yet — drop a job file to begin</div>';return;}
  RUNS_BY_ID={};
  runs.forEach(function(r){ RUNS_BY_ID[r.run_id]=r; });
  var h=drawRuns(runs);
  m.innerHTML=h;
}
function closeModal(){document.getElementById('sdvpModal').classList.remove('on');
  document.getElementById('sdvpBody').innerHTML='';}
function openModal(title,html){
  document.getElementById('sdvpTitle').textContent=title;
  document.getElementById('sdvpBody').innerHTML=html;
  var mo=document.getElementById('sdvpModal');
  mo.classList.add('on');
  var cb=document.getElementById('sdvpClose');
  if(cb&&cb.focus)cb.focus();}
function showSheet(src,title){openModal(title,'<img src="'+src+'">');}
function showAudio(a){
  var rec=a.recorded||{};
  var h='<table class="r"><tr><th>check</th><th>result</th><th>detail</th></tr>';
  (a.checks||[]).forEach(function(c){
    h+='<tr><td>'+esc(c.name)+'</td><td><span class="chip c-'+(c.ok?'STORED':'FAILED')+'">'
      +(c.ok?'ok':'FAILED')+'</span></td><td>'+esc(c.detail||'')+'</td></tr>';});
  h+='</table>';
  h+='<div class="meta" style="margin-top:16px;font-size:19px;color:#15302f">recorded, not gated</div>';
  h+='<table class="r">';
  if(rec.rms_db)h+='<tr><td>RMS level</td><td>'+rec.rms_db.map(function(x){return x.toFixed(2)+' dB';}).join(' &nbsp; ')+'</td></tr>';
  if(rec.peak_db)h+='<tr><td>peak level</td><td>'+rec.peak_db.map(function(x){return x.toFixed(2)+' dB';}).join(' &nbsp; ')+'</td></tr>';
  if(rec.imbalance_db!=null)h+='<tr><td>channel imbalance</td><td>'+rec.imbalance_db+' dB</td></tr>';
  if(rec.channels!=null)h+='<tr><td>channels</td><td>'+rec.channels+'</td></tr>';
  if(a.from_height!=null)h+='<tr><td>measured on</td><td>'+a.from_height+'p '+esc(a.codec||'')+'</td></tr>';
  h+='</table>';
  h+='<div class="reason">Levels are recorded but do not gate. No corpus exists yet to draw honest bands from.</div>';
  openModal('audio',h);}
document.getElementById('sdvpClose').addEventListener('click',closeModal);
document.getElementById('sdvpModal').addEventListener('click',function(e){
  if(e.target.id==='sdvpModal')closeModal();});
// Attached to the modal element, not the document. The page gate's stubbed DOM
// has no document-level listener, and a page that cannot be executed by the
// gate cannot be checked by it - so the page bends, not the gate.
// Focus lands on the close button when the modal opens, so Escape reaches here.
(function(){var mo=document.getElementById('sdvpModal');
 if(mo&&mo.addEventListener)mo.addEventListener('keydown',function(e){
   if(e.key==='Escape')closeModal();});})();
// ---- STOP AND ABORT --------------------------------------------------
// STOP  finishes the film in flight completely, then halts.
// ABORT kills the daemon now; recovery reads the flag and does NOT re-queue.
// An upload in flight always completes - the daemon REFUSES an abort during
// one and says so, rather than leaving a truncated file under a trusted name.
// No browser dialogs anywhere: confirmation is a modal in the SDVP palette.
function askStop(abort){
  var t=abort?'ABORT this run?':'Stop after the current file?';
  var body=abort
    ? '<div class="reason" style="font-size:18px;line-height:1.55">This stops everything <b>now</b>. '
      +'The film being worked on is abandoned and its partial output discarded. '
      +'The job will <b>not</b> resume - if you want the rest, build a new job.<br><br>'
      +'If a file is uploading, this will be refused: that upload has to finish so nothing '
      +'truncated is left at the destination.</div>'
    : '<div class="reason" style="font-size:18px;line-height:1.55">The film being worked on '
      +'finishes completely - encode, upload, record. Then the run halts and nothing further '
      +'starts.<br><br>There is no resume. If you want the remaining films later, build a new job.</div>';
  body+='<div style="margin-top:22px">'
    +'<button class="cbtn go" onclick="doStop('+(abort?'true':'false')+')">'
    +(abort?'ABORT NOW':'STOP AFTER THIS FILE')+'</button>'
    +'<button class="cbtn no" onclick="closeModal()">cancel</button></div>';
  openModal(t,body);
}
function doStop(abort){
  openModal(abort?'ABORT':'STOP','<div class="meta">asking the daemon\u2026</div>');
  fetch(abort?'/api/abort':'/api/stop',{cache:'no-store'})
   .then(function(r){return r.json();})
   .then(function(j){
     if(j.ok){
       openModal(j.mode==='ABORT'?'Aborting':'Stopping',
         '<div class="reason" style="font-size:18px">'+esc(j.message)+'</div>');
     } else {
       openModal('Not done','<div class="err" style="font-size:17px;line-height:1.5">'
         +esc(j.error)+'</div>');
     }
   })
   .catch(function(e){
     // An ABORT kills the daemon, so the reply may never arrive. That is the
     // button working, not failing.
     openModal(abort?'Aborting':'Stopping',
       '<div class="reason" style="font-size:18px">'
       +(abort?'The daemon stopped before it could answer. That is expected on an abort.'
              :'No answer from the daemon: '+esc(e.message))+'</div>');
   });
}

// ---- RUN REPORT ------------------------------------------------------
// Reads the RECORD via /api/report/<n>, not this page's live state. The two
// disagreeing is the whole reason it exists: on 2026-08-20 run 13 read
// COMPLETE here and RUNNING in the record, and two movies read DONE here and
// UPLOADING there. A report drawn from this page's own data would have shown
// a confident green.
function repBtn(r){
  if(r.run_number==null)return'';
  var v=VERDICTS?VERDICTS[r.run_number]:null;
  if(!v)return '<button class="rbtn" style="background:#e2e8e7;color:#46605e;border-color:#d8e2e0" '
    +'onclick="showReport('+r.run_number+')">RUN REPORT</button>';
  var cls=v.verdict==='FAIL'?'fail':(v.verdict==='CHECK'?'warn':'pass');
  var n=(v.findings||[]).length;
  var lab='RUN REPORT'+(n?' \u00b7 '+n:'');
  return '<button class="rbtn '+cls+'" onclick="showReport('+r.run_number+')">'+lab+'</button>';
}
function n0(v){return v==null?0:Number(v);}
function vchip(v){return '<span class="vd '+v+'">'+v+'</span>';}
function repRow(label,verdict,evidence,fix){
  return '<tr><td style="white-space:nowrap">'+esc(label)+'</td><td>'+vchip(verdict)+'</td>'
    +'<td>'+evidence+(fix?'<div class="fix">'+fix+'</div>':'')+'</td></tr>';
}
function showReport(num){
  openModal('Run #'+num+' report','<div class="meta">reading the record\u2026</div>');
  fetch('/api/report/'+num,{cache:'no-store'}).then(function(x){return x.json();}).then(function(j){
    if(!j.ok){openModal('Run #'+num+' report','<div class="err">'+esc(j.error)+'</div>');return;}
    openModal('Run #'+num+' report',buildReport(j,num));
  }).catch(function(e){
    openModal('Run #'+num+' report','<div class="err">could not read the record: '+esc(e.message)+'</div>');
  });
}
// Seconds as m:ss or h:mm:ss - a person reads "3:07", not "187.1 s".
function hms(sec){
  if(sec==null||!isFinite(sec))return '\u2014';
  var t=Math.round(Number(sec)),h=Math.floor(t/3600),m=Math.floor((t%3600)/60),s2=t%60;
  var p=function(n){return n<10?'0'+n:''+n;};
  return h?(h+':'+p(m)+':'+p(s2)):(m+':'+p(s2));
}
function gb(b){
  if(b==null||!isFinite(b))return '\u2014';
  var n=Number(b);
  if(n>=1073741824)return (n/1073741824).toFixed(1)+' GB';
  if(n>=1048576)return (n/1048576).toFixed(0)+' MB';
  if(n>=1024)return (n/1024).toFixed(0)+' KB';
  return n+' B';
}
function buildReport(j,num){
  var run=j.run||{};
  // LAST is null until the first fetch lands. Guard it: a report opened before
  // then must still render from the record alone, minus the comparison row.
  var live=null;
  if(LAST&&LAST.runs&&LAST.runs.forEach){
    LAST.runs.forEach(function(r){if(Number(r.run_number)===Number(num))live=r;});
  }
  var inFlight=!run.finished_at;
  var h='';
  if(inFlight){
    h+='<div class="reason" style="background:#fdf3d6;color:#8a6d10;padding:11px 14px;border-radius:6px;margin-bottom:14px">'
      +'This run is still in flight. Rows that read CHECK because work is not finished yet are expected, not faults. '
      +'The rows worth reading mid-run are AUDIO and BITRATE \u2014 a defect there repeats on every remaining movie.</div>';
  }
  // FINDINGS PANEL. [MEASURED 2026-08-22] The button and this report body each
  // decided separately - run 38 showed a RED button above a report whose every
  // row read green, because the film that failed was never written to the record
  // and every row below describes only the record. The verdict and its findings
  // now come from the server, from the SAME call the button colours from, so a
  // finding added to the scoring function appears here the same day.
  // A CLEAN run says so out loud. A panel that is absent when all is well
  // teaches the eye to skip that part of the page.
  if(j.verdict){
    var V=j.verdict, fs=V.findings||[];
    var bg=V.verdict==='FAIL'?'#fbe4e4':(V.verdict==='CHECK'?'#fdf3d6':'#e3f3e6');
    var bd=V.verdict==='FAIL'?'#efbdbb':(V.verdict==='CHECK'?'#eddba1':'#b6dcc0');
    h+='<div style="background:'+bg+';border:1px solid '+bd+';border-radius:6px;padding:13px 16px;margin-bottom:16px">';
    h+='<div>'+vchip(V.verdict)+'<span style="margin-left:11px;font-size:16px;color:#46605e">'
      +(fs.length? (fs.length+' finding'+(fs.length===1?'':'s')) : 'nothing to look at')+'</span></div>';
    for(var fi=0;fi<fs.length;fi++){
      var F=fs[fi];
      h+='<div style="margin-top:11px;padding-top:11px;border-top:1px solid '+bd+'">'
        +'<span style="font-weight:600">'+esc(F.k)+'</span>'
        +(n0(F.n)>1?'<span style="color:#4d6462"> \u00d7 '+n0(F.n)+'</span>':'')
        +'<span style="margin-left:9px">'+vchip(F.sev)+'</span>'
        +(F.fix?'<div class="fix">'+esc(F.fix)+'</div>':'')
        +'</div>';
    }
    h+='</div>';
  }
  h+='<table class="rep"><tr><th style="width:150px">what</th><th style="width:90px">state</th><th>evidence, and what to do</th></tr>';

  // ITEMS
  var ph={};(j.items_by_phase||[]).forEach(function(x){ph[x.phase]=x.cnt;});
  var nDone=n0(ph.DONE),nFail=n0(ph.FAILED),nTot=0;
  Object.keys(ph).forEach(function(k){nTot+=n0(ph[k]);});
  var other=nTot-nDone-nFail;
  var liveDone=live?(live.items||[]).filter(function(x){return x.phase==='DONE';}).length:null;
  // A movie that owed nothing has EVERY rung already at its destinations and
  // NONE stored. A movie that did work has the inverse. [MEASURED 2026-08-20,
  // run 13: 2 movies 6-exists/0-stored, 14 movies 0-exists/6-stored, nothing
  // in between.] Counting them apart stops "already there" reading as "stalled".
  var nPre=0;
  (j.per_movie||[]).forEach(function(x){ if(n0(x.n_stored)===0 && n0(x.n_exists)>0) nPre++; });
  var stalled=other-nPre; if(stalled<0)stalled=0;
  var v=nFail?'FAIL':(stalled?'CHECK':'PASS');
  h+=repRow('items',v,
    nTot+' in the record \u00b7 '+(nDone)+' encoded'
      +(nPre?' \u00b7 '+nPre+' skipped, already at their destinations':'')
      +(nFail?' \u00b7 <b>'+nFail+' failed</b>':'')
      +(stalled?' \u00b7 <b>'+stalled+' still mid-phase</b>':''),
    nFail?'A movie failed outright. Open its card for the reason, then re-run that show with on_existing set to skip \u2014 finished movies will not be redone.'
    :(stalled?'Movies are still working, or their finished state was never written down. If the run has ended, check the movie cards \u2014 if they read DONE there but not here, the record write was missed.'
    :(nPre?'The skipped movies were found already present at every destination they owed, so nothing was re-encoded or re-uploaded. Confirm them in your pCloud folder or Vimeo project listing if you want to see them.':'')));

  // RECORD vs LIVE
  if(live){
    var agree=(liveDone===nDone)&&(String(live.status)===String(run.status));
    h+=repRow('record vs page',agree?'PASS':'CHECK',
      'page: '+liveDone+' done, '+esc(live.status)+' \u00b7 record: '+nDone+' done, '+esc(run.status),
      agree?'':'The daemon\u2019s own view and the stored record disagree. The files themselves are usually fine \u2014 it is the bookkeeping that is behind. Worth reporting; nothing to re-run.');
  }

  // RUNGS
  var rs={},rFail=0,rTot=0;
  (j.rungs_by_state||[]).forEach(function(x){rs[x.state]=n0(rs[x.state])+n0(x.cnt);rTot+=n0(x.cnt);if(x.state==='FAILED')rFail+=n0(x.cnt);});
  var rungTxt=Object.keys(rs).sort().map(function(k){return n0(rs[k])+' '+k.toLowerCase();}).join(' \u00b7 ');
  h+=repRow('rungs',rFail?'FAIL':(rTot?'PASS':'CHECK'),rTot+' outputs \u00b7 '+rungTxt,
    rFail?'One or more outputs failed encoding or verification. The movie card names which rung and why. Re-run the show; only the failed rungs will be redone.'
    :(rTot?'':'No outputs recorded yet.'));

  // DELIVERIES
  var pc={ok:0,bad:0},vi={ok:0,bad:0};
  (j.deliveries||[]).forEach(function(d){
    var t=(d.destination==='vimeo')?vi:pc;
    if(Number(d.ok)===1)t.ok+=n0(d.cnt);else t.bad+=n0(d.cnt);});
  h+=repRow('pCloud',pc.bad?'FAIL':(pc.ok?'PASS':'NA'),
    pc.ok+' files stored and checksum-verified'+(pc.bad?' \u00b7 <b>'+pc.bad+' not confirmed</b>':''),
    pc.bad?'A file did not confirm at pCloud. Check the folder yourself; if the file is missing, re-run the show \u2014 existing files are skipped.':'');

  var w=(j.witness||[])[0]||{};
  var wn=n0(w.n),wver=n0(w.verified),wmiss=n0(w.drift_missing);
  // ⛔ AN UNANSWERED CONFIRMATION IS NOT A REJECTION. vi.bad means Vimeo
  // refused or disagreed - a real failure. wver<wn while the run is still
  // working means only that Vimeo had not finished transcoding when we
  // asked, ~2s after upload. [MEASURED 2026-08-28, run 48] this row read
  // FAIL on six films that were all healthy and all confirmed later.
  var vPend=(wver<wn)&&!vi.bad&&inFlight;
  var vv=vi.bad?'FAIL':(vPend?'CHECK':((wver<wn)?'FAIL':(wn===0?'NA':(wmiss?'CHECK':'PASS'))));
  h+=repRow('Vimeo',vv,
    wn?(wver+' of '+wn+' confirmed by Vimeo\u2019s own duration'+(wmiss?' \u00b7 <b>'+wmiss+' carry no drift figure</b>':' \u00b7 worst drift '+(w.drift_max==null?'\u2014':w.drift_max+'s'))):'nothing sent to Vimeo',
    vPend?'Normal while a run is working. Vimeo takes minutes to transcode what we hand it, so a check made seconds after upload has nothing to answer with. It resolves before the run closes - re-open this report then.'
    :(wver<wn&&wn)?'Vimeo never confirmed a file, or its duration did not match. Open the movie in Vimeo and play it. If it is short or missing, re-run that show.'
    :(wmiss?'These were verified by code that did not keep the drift number. The verdict stands but the evidence behind it was discarded \u2014 fixed 20 Aug, so runs from then on carry the figure.':''));

  // AUDIO
  var a=(j.audio||[])[0]||{};
  var an=n0(a.n),apass=n0(a.passed),aun=n0(a.unmeasurable);
  // A movie that was never probed is UNMEASURED, not FAILED. Only a movie with
  // a recorded audio verdict of 0 has actually failed a gate. Conflating the two
  // teaches the reader to discount red, which is the one thing a report must
  // never do.
  // Count each movie ONCE. A never-probed movie has flat_max NULL too, so the
  // endpoint's "unmeasurable" tally overlaps "not probed" and the two would be
  // reported twice in the same sentence.
  var aFail=0,aNone=0,aOld=0;
  (j.audio_rows||[]).forEach(function(r){
    if(r.audio_ok==null){aNone++;return;}
    if(r.audio_ok===0)aFail++;
    if(r.flat_max==null&&r.silence_n==null)aOld++;});
  aun=aOld;
  var av=aFail?'FAIL':((aun||aNone)?'CHECK':(an?'PASS':'NA'));
  h+=repRow('audio',av,
    an?(apass+' passed'
        +(aFail?' \u00b7 <b>'+aFail+' failed a gate</b>':'')
        +(aNone?' \u00b7 '+aNone+' not probed (nothing was encoded)':'')
        +(aun?' \u00b7 <b>'+aun+' measured by the old probe</b>':
          ' \u00b7 RMS '+(a.rms_min==null?'\u2014':a.rms_min.toFixed(1))+' to '+(a.rms_max==null?'\u2014':a.rms_max.toFixed(1))
          +' dB \u00b7 worst imbalance '+(a.imb_max==null?'\u2014':a.imb_max+' dB'))):'no audio measured',
    aFail?'A movie failed a gated audio check \u2014 no audio stream at all, or a dead channel. Play the master before re-encoding; the fault is in the source, not the encode, and the files were still delivered.'
    :(aun?'Measured before 20 Aug, when the probe shared a pass with the contact sheet and under-read long files by up to 22 dB. These numbers are not trustworthy and must not be used to set thresholds. The files themselves were never affected.'
    :(aNone?'Not a fault. These movies were already present at their destinations, so nothing was encoded and there was nothing to measure.':'')));

  // AUDIO ROWS with duplicate detection
  if((j.audio_rows||[]).length){
    var seen={},dups={};
    j.audio_rows.forEach(function(r){
      if(r.rms_max_db==null)return;
      var k=r.rms_max_db+'|'+r.rms_min_db;
      if(seen[k])dups[k]=1;seen[k]=1;});
    var ndup=Object.keys(dups).length;
    h+='</table>';
    h+='<div class="meta" style="margin-top:20px;font-size:19px;color:#15302f">audio, movie by movie'
      +(ndup?' \u2014 <span style="color:#8a6d10">identical readings found on different movies</span>':'')+'</div>';
    if(ndup)h+='<div class="fix" style="margin-bottom:8px">Two movies of different lengths cannot measure identically. A repeated row means the probe reported on something other than that movie. Highlighted below.</div>';
    h+='<table class="rep"><tr><th>movie</th><th>RMS</th><th>peak</th><th>imbalance</th><th>silence</th><th>flat</th><th>sheets</th></tr>';
    j.audio_rows.forEach(function(r){
      var k=r.rms_max_db+'|'+r.rms_min_db;
      var cls=(r.rms_max_db!=null&&dups[k])?' class="dup"':'';
      h+='<tr'+cls+'><td>'+esc(r.source_name)+'</td>'
        +'<td>'+(r.rms_min_db==null?'\u2014':r.rms_min_db.toFixed(2)+' / '+r.rms_max_db.toFixed(2))+'</td>'
        +'<td>'+(r.peak_max_db==null?'\u2014':r.peak_max_db.toFixed(2))+'</td>'
        +'<td>'+(r.imbalance_db==null?'\u2014':r.imbalance_db+' dB')+'</td>'
        +'<td>'+(r.flat_max==null?'<span style="color:#8a6d10">not kept</span>':r.flat_max)+'</td>'
        +'<td>'+(r.silence_n==null?'<span style="color:#8a6d10">not measured</span>'
                  :(n0(r.silence_n)===0?'none'
                  :(hms(r.silence_total_s)+' \u00b7 '+r.silence_pct+'%'
                    +(Number(r.silence_ends_at_end)===1?' \u00b7 at end':''))))+'</td>'
        +'<td>'+n0(r.sheets_uploaded)+'</td></tr>';});
    h+='</table><table class="rep">';
  }

  // ARTIFACTS - sheets, audio reports, manifests. Every one carries a pCloud
  // fileid the record used to discard entirely; sheets carry a verified sha1
  // as well. Before 21 Aug the report could say "62 videos confirmed" and
  // "sheets: 1" in the same breath, where the second meant only that the daemon
  // believed it had tried. Same evidence class now, or say nothing.
  var arts=j.artifacts||[];
  if(arts.length){
    var aTot=0,aOk=0,aConf=0,aBytes=0;
    arts.forEach(function(x){aTot+=n0(x.cnt);aOk+=n0(x.ok_n);aConf+=n0(x.confirmed);aBytes+=n0(x.bytes);});
    var dirty=(j.artifacts_dirty||[]).length;
    var label={sheet:'contact sheets',audio_report:'audio reports',manifest:'manifests'};
    var parts=arts.map(function(x){
      return n0(x.cnt)+' '+(label[x.kind]||x.kind)
             +(n0(x.sha1_ok)?' ('+n0(x.sha1_ok)+' checksum-verified)':'');});
    h+=repRow('other files',dirty?'CHECK':(aConf===aTot?'PASS':'CHECK'),
      parts.join(' \u00b7 ')+' \u00b7 <b>'+aConf+' of '+aTot+' confirmed by pCloud file id</b> \u00b7 '+gb(aBytes),
      dirty?'A sheet, audio report or manifest did not confirm at pCloud. The video files are unaffected. Look in the destination folder; if it is missing, re-running the show with on_existing set to skip will redo only what is absent.'
      :(aConf===aTot?'':'Some artifacts have no file id from pCloud, so we only know we tried to send them. Check the destination folder.'));
  }

  // SILENCE - recorded only, never gated. Dr. K's ruling 21 Aug.
  var sil=(j.audio_rows||[]).filter(function(r){return r.silence_n!=null;});
  if(sil.length){
    var withSil=sil.filter(function(r){return n0(r.silence_n)>0;});
    var worst=null;
    withSil.forEach(function(r){if(!worst||n0(r.silence_pct)>n0(worst.silence_pct))worst=r;});
    var midFilm=withSil.filter(function(r){return Number(r.silence_ends_at_end)!==1;}).length;
    h+=repRow('silence','NA',
      withSil.length?(withSil.length+' of '+sil.length+' movie(s) carry silence \u00b7 worst '
        +hms(worst.silence_total_s)+' ('+worst.silence_pct+'%) in '+esc(worst.source_name)
        +(midFilm?' \u00b7 <b>'+midFilm+' not at the end of the film</b>':' \u00b7 all at the end of the film')):
        'none detected in '+sil.length+' movie(s)',
      withSil.length?'Recorded only \u2014 nothing here fails anything. A FADE OR END CARD is a short stretch at the end; our edit template leaves about 1.8 s. A SLO-MO PASSAGE is a short stretch in the middle. A PULLED MICROPHONE is a long one anywhere. Judge it against what you know of the master.':'');
  }

  // BITRATE BANDS
  var bands=j.bands||[];
  h+=repRow('bitrate',bands.length?'PASS':'NA',
    bands.length?bands.map(function(b){return b.codec+' '+b.height+'p '+(b.lo==null?'\u2014':b.lo.toFixed(0))+'\u2013'+(b.hi==null?'\u2014':b.hi.toFixed(0))+'%';}).join(' \u00b7 '):'nothing measured',
    bands.length?'Percentages are each rung\u2019s share of its own ceiling. A rung outside its band fails at encode time, so a number here means it passed. Very low figures across a whole run can mean a soft source.':'');

  // WORKING FILES - record for the paths, disk for the truth. The old version
  // read LIVE PAGE STATE, so it could not name a path, could not total the
  // disk, and vanished entirely for any run the page no longer held.
  // Retention on a FAILED movie is deliberate, so this is CHECK, never FAIL.
  // But it is proportional to failures and grows unwatched: [MEASURED 21 Aug]
  // 16.6 GB sat in two directories from run 7 with nothing anywhere naming them.
  var scr=j.scratch||[];
  var here=scr.filter(function(x){return x.present;});
  var goneN=scr.length-here.length;
  if(scr.length){
    var sBytes=0;here.forEach(function(x){sBytes+=n0(x.bytes);});
    var listed=here.map(function(x){
      return '<div style="font-family:ui-monospace,Menlo,monospace;font-size:15px;margin-top:4px">'
        +esc(x.path)+'  \u2014  '+gb(x.bytes)+'</div>';}).join('');
    h+=repRow('working files',here.length?'CHECK':'PASS',
      here.length?('<b>'+here.length+' movie(s) kept their working directory \u00b7 '+gb(sBytes)+'</b>'+listed)
        :(goneN+' recorded, none still on disk'),
      here.length?'Kept on purpose \u2014 a failed movie\u2019s part-finished files are the ones worth looking at. Once the failure is understood, delete the directory above in Transmit. It is under /var/lib/ so it is root-only and will not appear in an ordinary file browser. Nothing else cleans these up; they accumulate one per failed movie.'
        :'These were recorded as retained and are no longer on disk \u2014 already cleaned up.');
  }else{
    h+=repRow('working files','PASS','nothing left behind',
      'Every movie in this run finished cleanly, so its working directory was deleted. Runs before 21 Aug did not record the path, so an older run shows nothing here whether or not it left files.');
  }

  // DIRTY DELIVERIES
  if((j.deliveries_dirty||[]).length){
    h+=repRow('retries',(j.deliveries_dirty.length?'CHECK':'PASS'),
      j.deliveries_dirty.length+' delivery(ies) needed more than one attempt or reported an error',
      'Uploads that retried and then succeeded are not a fault, but a run full of them means the link or the vendor was struggling.');
  }

  h+='</table>';
  h+='<div class="reason" style="margin-top:16px">Read from the stored record'
    +(run.finished_at?(' \u00b7 run finished '+new Date(run.finished_at).toLocaleString()):' \u00b7 run not finished')
    +' \u00b7 status '+esc(run.status||'\u2014')+'</div>';
  return h;
}
// ---- RUN LIST
// THE NEWEST RUN IS EXPANDED. Every older one collapses to a clickable line,
// whatever its status - a failed run gets no special treatment, because the
// rule "newest is open" is predictable and "open if something went wrong" is
// not. A backlog run carries 20-30 film cards; forty of those stacked is the
// mess this replaces. Ten lines show by default, the rest behind a toggle.
var RUNS_BY_ID = {};
var SHOW_ALL_RUNS = false;
var RECENT_LINES = 10;

function sortItems(r){
  var items=(r.items||[]).slice();
  var DONE={DONE:1,FAILED:1};
  function bucket(it){ if(it.phase==='QUEUED') return 1; if(DONE[it.phase]) return 2; return 0; }
  items.forEach(function(it,ix){it.__ix=ix;});
  items.sort(function(a,b){
    var ba=bucket(a), bb=bucket(b);
    if(ba!==bb) return ba-bb;
    return ba===2 ? b.__ix-a.__ix : a.__ix-b.__ix;
  });
  return items;
}

function runHeadBits(r){
  var rn=(r.run_number!=null?'Run #'+r.run_number+' \u00b7 ':'');
  var rt=r.started_at?new Date(r.started_at).toLocaleTimeString():'';
  var rf=r.finished_at?new Date(r.finished_at).toLocaleTimeString():'';
  var rel='';
  if(r.started_at){
    var endMs=r.finished_at?new Date(r.finished_at).getTime():Date.now();
    var mins=(endMs-new Date(r.started_at).getTime())/60000;
    if(mins>=0)rel=(mins<90?mins.toFixed(0)+' min':(mins/60).toFixed(1)+' h')+(r.finished_at?'':' so far');
  }
  var all=(r.items||[]);
  var nDone=all.filter(function(x){return x.phase==='DONE';}).length;
  var nFail=all.filter(function(x){return x.phase==='FAILED';}).length;
  return { rn: rn,
    time: rt+(rf?' \u2192 '+rf:'')+(rel?' \u00b7 '+rel:''),
    tally: all.length?(' \u00b7 '+nDone+' of '+all.length+' complete'+(nFail?' \u00b7 '+nFail+' FAILED':'')):'',
    failed: nFail>0 };
}

function openRun(id){
  var r=RUNS_BY_ID[id];
  if(!r){ openModal('Run','<div class="meta">that run is no longer in the state file</div>'); return; }
  var b=runHeadBits(r);
  var h='<div class="meta" style="font-size:19px">'+esc(r.status)+b.tally+' \u00b7 '+esc(b.time)+'</div>';
  var items=sortItems(r);
  if(!items.length) h+='<div class="empty">no films recorded on this run</div>';
  else items.forEach(function(it){ h+=card(it); });
  openModal(b.rn.replace(/ \u00b7 $/,'')+' \u2014 '+(r.job_label||''), h);
}

function toggleAllRuns(){ SHOW_ALL_RUNS=!SHOW_ALL_RUNS; if(LAST_STATE) draw(LAST_STATE); }

function drawRuns(runs){
  var h='';
  // NEWEST FIRST, expanded. state.runs is already newest-first.
  var live=runs[0];
  if(live){
    var b=runHeadBits(live);
    h+='<div class="meta" style="margin:22px 0 9px;font-size:21px;color:#15302f">'
      +b.rn+esc(live.job_label)+b.tally+' \u00b7 '+esc(b.time)+remaining(live)+' \u00b7 '
      +esc(live.status)+repBtn(live)+'</div>';
    sortItems(live).forEach(function(it){ h+=card(it); });
  }
  var rest=runs.slice(1);
  if(!rest.length) return h;
  var shown = SHOW_ALL_RUNS ? rest : rest.slice(0, RECENT_LINES);
  h+='<div class="meta" style="margin:34px 0 9px;font-size:19px;color:#15302f">'
    +'earlier runs <span style="font-weight:400;color:#3f5b59">'
    +'\u2014 click one to see its films</span></div>';
  shown.forEach(function(r){
    var b=runHeadBits(r);
    h+='<div class="runline'+(b.failed?' bad':'')+'" onclick="openRun(\''+esc(r.run_id)+'\')">'
      +'<b>'+esc(b.rn.replace(/ \u00b7 $/,''))+'</b> &middot; '+esc(r.job_label||'')
      +'<div class="muted" style="font-size:15px;margin-top:3px">'
      +esc(r.status)+b.tally+' \u00b7 '+esc(b.time)+'</div></div>';
  });
  if(rest.length > RECENT_LINES){
    h+='<div style="margin-top:12px"><button class="btn" onclick="toggleAllRuns()">'
      +(SHOW_ALL_RUNS ? 'show only the last '+RECENT_LINES
                      : 'show all '+rest.length+' earlier runs')+'</button></div>';
  }
  return h;
}

function tick(){
  // Verdicts first, then state. A verdicts failure must not stop the page
  // drawing - the buttons simply render neutral until the next cycle.
  fetch('/api/verdicts',{cache:'no-store'}).then(function(r){return r.json();})
   .then(function(j){ if(j&&j.ok)VERDICTS=j.verdicts; })
   .catch(function(){})
   .then(function(){
     return fetch('/api/state',{cache:'no-store'}).then(function(r){return r.json();}).then(draw);
   })
   .catch(function(){document.getElementById('stamp').textContent='no answer';});
}
function schedule(){
  if(timer)clearInterval(timer);
  var v=Number(document.getElementById('iv').value);
  if(v>0)timer=setInterval(tick,v);
}
document.getElementById('iv').addEventListener('change',schedule);
tick();schedule();
</script></body></html>
