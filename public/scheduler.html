<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SDVP Encoder — Jobs</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--teal:#0d6d70;--teal2:#0a4f52;--gold:#c9a227;--ink:#15302f;--bg:#f4f7f6;--line:#d8e2e0;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Oswald,system-ui,sans-serif;font-size:18px;line-height:1.5}
header{background:var(--teal);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
h1{font-size:23px;font-weight:400;margin:0;letter-spacing:.06em}
.sp{flex:1}
a.nav{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.5);padding:6px 15px;border-radius:16px;font-size:16px}
a.nav:hover{background:rgba(255,255,255,.14)}
main{max-width:1180px;margin:0 auto;padding:22px 20px 90px}
.card{background:#fff;border:1px solid var(--line);border-radius:9px;padding:20px 22px;margin-bottom:18px}
h2{font-size:21px;font-weight:400;margin:0 0 14px;letter-spacing:.04em}
h3{font-size:19px;font-weight:400;margin:0 0 10px}
.meta{font-size:17px;color:#3f5b59}
.muted{font-size:16px;color:#5d7472}
input[type=text]{font-family:inherit;font-size:18px;padding:9px 12px;border:1px solid var(--line);border-radius:6px;width:100%;background:#fff;color:var(--ink)}
button{font-family:inherit;cursor:pointer}
.btn{font-size:17px;padding:9px 19px;border-radius:18px;border:1px solid var(--line);background:#fff;color:var(--ink)}
.btn:hover{border-color:var(--teal)}
.btn.pri{background:var(--teal);color:#fff;border-color:var(--teal)}
.btn.pri:hover{background:var(--teal2)}
.btn.warn{background:#fdf3d6;color:#8a6d10;border-color:#eddba1}
.btn.dim{background:#eef3f2;color:#4d6462}
.btn[disabled]{opacity:.45;cursor:default}
.crumb{font-size:17px;margin-bottom:12px;color:#3f5b59}
.crumb a{color:var(--teal);text-decoration:none;cursor:pointer}
.crumb a:hover{text-decoration:underline}
.row{display:flex;align-items:center;gap:12px;padding:9px 10px;border-bottom:1px solid var(--line)}
.row:hover{background:#f7faf9}
.row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .dt{font-size:15px;color:#5d7472;white-space:nowrap}
.row .sz{font-size:15px;color:#5d7472;width:82px;text-align:right;white-space:nowrap}
.dir{color:var(--teal);cursor:pointer}
.dir:hover{text-decoration:underline}
input[type=checkbox]{width:19px;height:19px;accent-color:var(--teal)}
.batch{border:1px solid var(--line);border-radius:8px;padding:15px 17px;margin-bottom:13px;background:#fbfdfc}
.batch .hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tag{font-size:15px;padding:4px 12px;border-radius:5px;background:#e3f3e6;color:#1d6b33;display:inline-block}
.tag.b{background:#e5eef7;color:#2c5a86}
.tag.g{background:#fdf3d6;color:#8a6d10}
select{font-family:inherit;font-size:17px;padding:8px 11px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
table.rv{width:100%;border-collapse:collapse;font-size:16px}
table.rv td,table.rv th{padding:8px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.rv th{font-weight:400;font-size:15px;color:#2c4a48}
#modal{position:fixed;inset:0;background:rgba(10,49,48,.82);display:none;align-items:center;justify-content:center;padding:26px;z-index:99}
#modal.on{display:flex}
#box{background:#fff;border-radius:11px;max-width:1000px;width:100%;max-height:88vh;overflow:auto;padding:26px 28px;position:relative}
#close{position:absolute;top:14px;right:16px;font-size:16px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:5px 13px}
.err{background:#fbe4e4;color:#8a1f1b;padding:11px 14px;border-radius:6px;font-size:17px;margin-top:10px}
.ok{background:#e3f3e6;color:#1d6b33;padding:11px 14px;border-radius:6px;font-size:17px;margin-top:10px}
.sum{background:#eef3f2;border-left:3px solid var(--teal);padding:13px 16px;border-radius:5px;font-size:18px;margin-top:16px;line-height:1.55}
.empty{text-align:center;color:#5d7472;padding:34px 0;font-size:19px}
</style></head><body>
<header>
  <h1>SDVP Encoder — Jobs</h1>
  <span class="sp"></span>
  <a class="nav" href="/">run card &rarr;</a>
</header>
<main>
  <div class="card" id="heldCard">
    <h2>Jobs in progress</h2>
    <div id="heldList"><div class="empty">nothing held</div></div>
  </div>

  <div class="card">
    <h2>Build a job</h2>
    <div style="margin-bottom:15px">
      <div class="muted" style="margin-bottom:5px">name this job</div>
      <input type="text" id="jobName" placeholder="e.g. Tervuren national — movies and JMDs">
      <div id="editingNote" style="margin-top:9px"></div>
    </div>
    <div id="batches"></div>
    <div style="margin-top:14px;display:flex;gap:11px;flex-wrap:wrap">
      <button class="btn" onclick="addBatch()">+ add a batch</button>
      <span class="sp" style="flex:1"></span>
      <button class="btn pri" id="btnReview" onclick="review()">review &amp; send &rarr;</button>
    </div>
  </div>
</main>

<div id="modal"><div id="box"><button id="close" onclick="closeModal()">close</button><div id="body"></div></div></div>

<script>
var PROFILES=[], PRESETS={}, BATCHES=[], BROWSING=null, SENDING=false;
// One place that turns an output into words, so the batch line, the editor and
// the review can never disagree. It MUST read destination_overrides: reading
// only the codec-level destinations printed "pcloud" for a ladder whose 1080p
// rung also went to Vimeo. Caught 2026-08-20.
function outWords(o){
  var ov=o.destination_overrides||null;
  if(!ov) return o.codec+' '+o.rungs.join(', ')+' \u2192 '+(o.destinations||[]).join(' + ');
  var groups={};
  o.rungs.forEach(function(h){
    var d=(ov[h]||ov[String(h)]||o.destinations||[]).slice().sort().join(' + ');
    (groups[d]=groups[d]||[]).push(h);
  });
  return Object.keys(groups).map(function(d){
    return o.codec+' '+groups[d].join(', ')+' \u2192 '+d;
  }).join('   ');
}
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function gb(b){return b>=1e9?(b/1e9).toFixed(2)+' GB':(b/1e6).toFixed(0)+' MB';}
function dt(s){if(!s)return '';var d=new Date(s);return isNaN(d)?'':d.toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}
function uid(){return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);}
function openModal(h){document.getElementById('body').innerHTML=h;document.getElementById('modal').classList.add('on');}
function closeModal(){document.getElementById('modal').classList.remove('on');document.getElementById('body').innerHTML='';}
document.getElementById('modal').addEventListener('click',function(e){if(e.target.id==='modal')closeModal();});

// ---- JOBS IN PROGRESS
// One panel, three states: running, queued, held. Job control lives HERE and
// not on the run card, so there is exactly one place a job can be acted on and
// one place to keep fresh. Polled, never rendered once - a stale page must not
// offer STOP on a run that ended ten minutes ago.
var PHASE_WORDS = { FETCHING:'downloading the master', PROBING:'reading the master',
  PLANNING:'working out the ladder', ENCODING:'encoding', VERIFYING:'checking the files',
  UPLOADING:'delivering', CLEANING:'tidying up' };

function elapsed(iso){
  if(!iso) return '';
  var s = Math.max(0, (Date.now() - new Date(iso).getTime())/1000);
  var h = Math.floor(s/3600), m = Math.floor((s%3600)/60);
  return h ? (h+'h '+m+'m') : (m+'m');
}

function runningRows(st){
  var runs = (st && st.runs) || [];
  var live = runs.filter(function(r){ return !r.finished_at && r.status === 'RUNNING'; });
  if(!live.length) return '';
  var h = '';
  live.forEach(function(r){
    (r.items || []).forEach(function(it){
      if(it.phase === 'DONE' || it.phase === 'FAILED') return;
      var pct = (it.progress && it.progress.pct) || 0;
      var word = PHASE_WORDS[it.phase] || String(it.phase || '').toLowerCase();
      h += '<div class="row"><div class="nm"><b>'+esc(it.name || r.job_label)+'</b>'
        +'<div class="muted"><span class="tag b">running</span> '+esc(word)
        +' &middot; '+pct.toFixed(0)+'% &middot; '+esc(elapsed(r.started_at))+' elapsed'
        +' &middot; '+esc(r.job_label)+'</div></div>'
        +'<button class="btn dim" disabled title="Needs the resume check before it is safe - a paused job would re-encode films it already finished.">pause</button>'
        +'<button class="btn" onclick="askStop()">stop</button>'
        +'<button class="btn warn" onclick="askAbort()">abort</button></div>';
    });
  });
  return h;
}

function askStop(){
  openModal('<h3>Stop after this film?</h3>'
    +'<div class="muted" style="margin-top:9px">The film being encoded now finishes and is delivered. '
    +'Nothing after it starts. The job is done - a stopped run is re-made as a fresh job, never resumed.</div>'
    +'<div style="margin-top:20px"><button class="btn pri" onclick="doStop()">stop after this film</button> '
    +'<button class="btn" onclick="closeModal()">keep going</button></div>');
}
function doStop(){
  fetch('/api/stop',{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){
    openModal('<h3>'+(j.ok?'Stopping':'Not stopped')+'</h3><div class="'+(j.ok?'ok':'err')+'">'
      +esc(j.message||j.error||'')+'</div>');
    loadProgress();
  }).catch(function(e){
    openModal('<h3>Not stopped</h3><div class="err">no answer from the encoder: '+esc(e.message)+'</div>');
  });
}
function askAbort(){
  openModal('<h3>Abort now?</h3>'
    +'<div class="muted" style="margin-top:9px">The encode is killed immediately and the part-file is discarded. '
    +'Work done on this film is lost. Files already delivered are untouched.</div>'
    +'<div style="margin-top:20px"><button class="btn warn" onclick="doAbort()">abort now</button> '
    +'<button class="btn" onclick="closeModal()">keep going</button></div>');
}
function doAbort(){
  fetch('/api/abort',{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){
    // The daemon refuses an abort mid-upload and explains why. Show ITS words -
    // duplicating that reasoning here would mean two places to keep true.
    openModal('<h3>'+(j.ok?'Aborting':'Not aborted')+'</h3><div class="'+(j.ok?'ok':'err')+'">'
      +esc(j.message||j.error||'')+'</div>');
    loadProgress();
  }).catch(function(e){
    openModal('<h3>Not aborted</h3><div class="err">no answer from the encoder: '+esc(e.message)+'</div>');
  });
}

function heldRows(j){
  if(!j || !j.ok || !j.held.length) return '';
  var h = '';
  if(j.queue && j.held.length > 1){
    h += '<div class="sum" style="margin:12px 0"><b>If you start everything: '
      +esc(j.queue.range)+'</b> &nbsp;<span class="muted">\u2014 they run back to back, '
      +'in the order they were built. Films already at their destination are skipped, '
      +'so a queue with much in place finishes under the low end.</span></div>';
  }
  j.held.forEach(function(x){
    h += '<div class="row"><div class="nm"><b>'+esc(x.label)+'</b>'
      +'<div class="muted"><span class="tag g">held</span> '+x.films+' file'+(x.films===1?'':'s')
      +' in '+x.batches+' batch'+(x.batches===1?'':'es')
      +' &middot; built '+esc(dt(x.built_at))
      +(x.estimate?' &middot; <b>'+esc(x.estimate.range)+'</b>':'')+'</div></div>'
      +'<button class="btn pri" onclick="release(\''+esc(x.file)+'\')">start</button>'
      +'<button class="btn" onclick="editHeld(\''+esc(x.file)+'\')">review &amp; edit</button>'
      +'<button class="btn dim" onclick="discard(\''+esc(x.file)+'\',\''+esc(x.label)+'\')">discard</button></div>';
  });
  return h;
}

function queuedRows(j){
  if(!j || !j.ok || !j.queued.length) return '';
  var h='';
  j.queued.forEach(function(q,ix){
    h+='<div class="row"><div class="nm"><b>'+esc(q.label)+'</b>'
      +'<div class="muted"><span class="tag b">queued</span> '
      +(ix===0?'next up':'position '+(ix+1))
      +(q.films!=null?' &middot; '+q.films+' file'+(q.films===1?'':'s'):'')
      +(q.batches!=null?' in '+q.batches+' batch'+(q.batches===1?'':'es'):'')
      +(q.built_at?' &middot; built '+esc(dt(q.built_at)):'')
      +(q.unreadable?' &middot; <b>this file could not be read</b>':'')
      +'</div></div>'
      +'<button class="btn" onclick="askHold(\''+esc(q.file)+'\',\''+esc(q.label)+'\')">hold</button></div>';
  });
  return h;
}
function askHold(f,label){
  openModal('<h3>Hold this job?</h3><div class="meta">'+esc(label)+'</div>'
    +'<div class="muted" style="margin-top:9px">It goes back to staging, where you can review, '
    +'edit or release it again. It has not started, so nothing is lost.</div>'
    +'<div style="margin-top:20px"><button class="btn pri" onclick="doHold(\''+esc(f)+'\')">hold it</button> '
    +'<button class="btn" onclick="closeModal()">leave it queued</button></div>');
}
function doHold(f){
  fetch('/api/job/unqueue/'+encodeURIComponent(f),{cache:'no-store'})
   .then(function(r){return r.json();}).then(function(j){
     // The encoder may have taken it in the seconds since the page drew - it
     // says so, and says what to do instead. Show ITS words.
     openModal('<h3>'+(j.ok?'Held':(j.started?'Already started':'Not held'))+'</h3>'
       +'<div class="'+(j.ok?'ok':'err')+'">'+esc(j.message||j.error||'')+'</div>');
     loadProgress();
   }).catch(function(e){
     openModal('<h3>Not held</h3><div class="err">no answer from the encoder: '+esc(e.message)+'</div>');
   });
}

function loadProgress(){
  Promise.all([
    fetch('/api/state',{cache:'no-store'}).then(function(r){return r.json();}).catch(function(){return null;}),
    fetch('/api/held',{cache:'no-store'}).then(function(r){return r.json();}).catch(function(){return null;}),
    fetch('/api/queued',{cache:'no-store'}).then(function(r){return r.json();}).catch(function(){return null;})
  ]).then(function(res){
    var el = document.getElementById('heldList');
    if(!el) return;
    // RUNNING, then QUEUED, then HELD - the order they will actually happen in.
    var run = runningRows(res[0]), held = heldRows(res[1]), queued = queuedRows(res[2]);
    if(!run && !held && !queued){ el.innerHTML = '<div class="empty">nothing running, queued or held</div>'; return; }
    el.innerHTML = run + queued + held;
  });
}
function loadHeld(){ loadProgress(); }

function release(f){
  fetch('/api/held/release/'+encodeURIComponent(f),{cache:'no-store'})
   .then(function(r){return r.json();}).then(function(j){
     openModal('<h3>'+(j.ok?'Started':'Not started')+'</h3><div class="'+(j.ok?'ok':'err')+'">'+esc(j.message||j.error)+'</div>');
     loadHeld();
   });
}
function discard(f,label){
  openModal('<h3>Discard this job?</h3><div class="meta">'+esc(label)+'</div>'
    +'<div class="muted" style="margin-top:9px">It has not run. Nothing is deleted anywhere else.</div>'
    +'<div style="margin-top:20px"><button class="btn warn" onclick="doDiscard(\''+esc(f)+'\')">discard it</button> '
    +'<button class="btn" onclick="closeModal()">keep it</button></div>');
}
function doDiscard(f){
  fetch('/api/held/discard/'+encodeURIComponent(f),{cache:'no-store'})
   .then(function(r){return r.json();}).then(function(j){ closeModal(); loadHeld(); });
}

// ---- EDIT A HELD JOB
// Loads it back into the builder. EDITING replaces: the old held file is
// discarded only AFTER the new one is written, so a failure never loses both.
var EDITING=null;
function editHeld(f){
  fetch('/api/held/get/'+encodeURIComponent(f),{cache:'no-store'})
   .then(function(r){return r.json();}).then(function(j){
     if(!j.ok){ openModal('<h3>Could not open it</h3><div class="err">'+esc(j.error)+'</div>'); return; }
     var job=j.job;
     document.getElementById('jobName').value=job.job_label||'';
     BATCHES=(job.batches||[]).map(function(b){
       // RESTORE THE DESTINATION. [MEASURED 2026-08-21] the reload rebuilt a
       // batch from its source, files and outputs and never read the override -
       // so reopening a job pointed at a test folder, changing one film and
       // saving, silently redirected it to 'encodes'. Nothing said so until the
       // files landed in the wrong place.
       //
       // The stored value is a full path. When it sits directly under the
       // source folder, the last segment IS the folder name and the strip shows
       // it selected. When it points somewhere else entirely - as a
       // hand-written job may - keep the whole path rather than guess, because
       // a name lifted out of an unrelated path would be a confident lie.
       var _src=String(b.source_path||'');
       var _ov=b.dest_path_override?String(b.dest_path_override):null;
       var _df='encodes';
       if(_ov){
         var _pre=(_src==='/'?'':_src)+'/';
         _df=(_ov.indexOf(_pre)===0 && _ov.slice(_pre.length).indexOf('/')===-1)
             ? _ov.slice(_pre.length) : _ov;
       }
       return { id:uid(), path:b.source_path, files:(b.items||[]).slice(),
                profile:profileFileMatching(b.outputs), outputs:JSON.parse(JSON.stringify(b.outputs||[])),
                dest_folder:_df,
                perfile:b._perfile||{} };
     });
     EDITING=f; BROWSING=null; drawBatches(); drawEditing();
     window.scrollTo(0,document.body.scrollHeight);
   });
}
// If the batch's outputs match a saved profile exactly, show that profile's
// name; otherwise it is a custom ladder and the dropdown says so.
function profileFileMatching(outs){
  var s=JSON.stringify(outs||[]);
  for(var i=0;i<PROFILES.length;i++){
    if(JSON.stringify(PROFILES[i].outputs)===s) return PROFILES[i]._file;
  }
  return '__custom__';
}
function drawEditing(){
  var el=document.getElementById('editingNote');
  if(!el)return;
  el.innerHTML = EDITING
    ? '<div class="tag g">editing a held job — sending will replace it</div>'
      +' <button class="btn dim" onclick="cancelEdit()">start a fresh job instead</button>'
    : '';
}
function cancelEdit(){
  EDITING=null; BATCHES=[]; document.getElementById('jobName').value='';
  drawBatches(); drawEditing();
}

// ---- BATCHES
function addBatch(){
  BATCHES.push({ id:uid(), path:null, files:[], profile:(PROFILES[0]&&PROFILES[0]._file)||null, outputs:null });
  BROWSING=BATCHES.length-1;
  drawBatches();
}
function removeBatch(i){ BATCHES.splice(i,1); if(BROWSING===i)BROWSING=null; drawBatches(); }
function profileOf(b){
  var p=PROFILES.filter(function(x){return x._file===b.profile;})[0];
  return p||PROFILES[0]||null;
}
function outputsOf(b){
  if(b.outputs)return b.outputs;
  var p=profileOf(b); return p?JSON.parse(JSON.stringify(p.outputs)):[];
}
function drawBatches(){
  var el=document.getElementById('batches');
  if(!BATCHES.length){el.innerHTML='<div class="empty">no batches yet — add one to begin</div>';return;}
  var h='';
  BATCHES.forEach(function(b,i){
    var outs=outputsOf(b);
    h+='<div class="batch"><div class="hd">';
    h+='<b>batch '+(i+1)+'</b>';
    h+='<span class="tag '+(b.files.length?'':'g')+'">'+b.files.length+' file'+(b.files.length===1?'':'s')+'</span>';
    if(b.path)h+='<span class="muted">'+esc(b.path)+'</span>';
    h+='<span class="sp" style="flex:1"></span>';
    h+='<select onchange="setProfile('+i+',this.value)">';
    // A NEUTRAL FIRST OPTION. ⛔ [MEASURED 2026-08-23] With no saved profiles
    // the list held exactly one entry - "edit or create" - which the browser
    // therefore had already selected. Selecting what is selected fires no
    // change event, so clicking it did nothing at all and threw no error.
    // This option is what the others change FROM.
    if(!b.profile || b.profile==='__none__')
      h+='<option value="__none__" selected>(choose a preset\u2026)</option>';
    PROFILES.forEach(function(p){
      h+='<option value="'+esc(p._file)+'"'+(p._file===b.profile?' selected':'')+'>'+esc(p.name)+'</option>';
    });
    if(b.profile==='__custom__')
      h+='<option value="__custom__" selected>(custom ladder)</option>';
    h+='<option value="__edit__">edit or create a preset\u2026</option>';
    h+='</select>';
    h+='<button class="btn" onclick="browseFor('+i+')">'+(b.path?'change files':'choose files')+'</button>';
    h+='<button class="btn dim" onclick="removeBatch('+i+')">remove</button>';
    h+='</div>';
    h+='<div class="muted" style="margin-top:9px">';
    outs.forEach(function(o){
      outWords(o).split('   ').forEach(function(w){
        h+='<span class="tag b" style="margin-right:8px">'+esc(w)+'</span>';
      });
    });
    h+='</div>';
    if(BROWSING===i)h+=browserHtml(b,i);
    h+='</div>';
  });
  el.innerHTML=h;
}
function setProfile(i,f){
  if(f==='__edit__'){ drawBatches(); openEditor(i); return; }
  if(f==='__none__'){ return; }
  BATCHES[i].profile=f; BATCHES[i].outputs=null; drawBatches();
}

// ---- PRESET EDITOR
// Every rung of every preset, with its destinations chosen per rung. Ticking a
// rung and ticking its destinations are separate acts, so a rung can end up
// selected with nowhere to go - that is refused at save, because an encode
// with no delivery is wasted work nobody would notice.
// The grid is built from what the PRESETS actually declare, so it can never
// offer something the box cannot encode.
var ED={target:null,name:'',rows:{}};
function edKey(preset,h){ return preset+'|'+h; }
function openEditor(batchIndex,fromFile){
  ED={target:batchIndex,name:'',rows:{}};
  // Seed from an existing profile if one was chosen to edit
  if(fromFile){
    var p=PROFILES.filter(function(x){return x._file===fromFile;})[0];
    if(p){
      ED.name=p.name;
      p.outputs.forEach(function(o){
        var ov=o.destination_overrides||{};
        o.rungs.forEach(function(h){
          ED.rows[edKey(o.preset,h)]={on:true,dests:(ov[h]||o.destinations||[]).slice()};
        });
      });
    }
  } else if(batchIndex!=null && BATCHES[batchIndex]){
    // Seed from what this batch currently has, so "edit" starts where you are
    outputsOf(BATCHES[batchIndex]).forEach(function(o){
      var ov=o.destination_overrides||{};
      o.rungs.forEach(function(h){
        ED.rows[edKey(o.preset,h)]={on:true,dests:(ov[h]||o.destinations||[]).slice()};
      });
    });
  }
  drawEditor();
}
function drawEditor(){

    if(pp.name===ED.name)
      h+=' <button class="btn dim" onclick="delProfile(\''+esc(pp._file)+'\',\''+esc(pp.name)+'\')">delete this preset</button>';

function delProfile(file,name){
  var h='<h3>Delete "'+esc(name)+'"?</h3>'
    +'<div class="muted">Jobs already built keep their own copy of the ladder, so nothing already queued or held changes.</div>'
    +'<div style="margin-top:20px"><button class="btn warn" onclick="doDelProfile(\''+esc(file)+'\')">delete it</button> '
    +'<button class="btn" onclick="drawEditor()">keep it</button></div>';
  openModal(h);
}
function doDelProfile(file){
  fetch('/api/profile/delete/'+encodeURIComponent(file),{cache:'no-store'})
   .then(function(r){return r.json();}).then(function(){
     fetch('/api/profiles',{cache:'no-store'}).then(function(r){return r.json();}).then(function(pj){
       if(pj.ok){ PROFILES=pj.profiles; PRESETS=pj.presets; }
       ED.name=''; drawEditor(); drawBatches();
     });
   });
}
function seedFrom(f){ var t=ED.target; openEditor(t,f||null); }
function edRung(k,on){
  var r=ED.rows[k]||{on:false,dests:[]};
  r.on=on; if(on&&!r.dests.length)r.dests=['pcloud'];
  ED.rows[k]=r; drawEditor();
}
function edDest(k,d,on){
  var r=ED.rows[k]||{on:false,dests:[]};
  if(on){ if(r.dests.indexOf(d)===-1)r.dests.push(d); r.on=true; }
  else r.dests=r.dests.filter(function(x){return x!==d;});
  ED.rows[k]=r; drawEditor();
}
// Turn the grid into the outputs shape the encoder reads. One output per
// preset; destinations that differ between rungs become per-rung overrides.
function edOutputs(){
  var outs=[];
  Object.keys(PRESETS).forEach(function(pk){
    var rungs=[], ov={}, all={};
    PRESETS[pk].rungs.forEach(function(ht){
      var r=ED.rows[edKey(pk,ht)];
      if(!r||!r.on)return;
      rungs.push(ht); ov[ht]=r.dests.slice();
      all[r.dests.slice().sort().join('+')]=1;
    });
    if(!rungs.length)return;
    var keys=Object.keys(all);
    var o={codec:PRESETS[pk].codec,preset:pk,rungs:rungs};
    if(keys.length===1){ o.destinations=keys[0].split('+').filter(Boolean); }
    else { o.destinations=['pcloud']; o.destination_overrides=ov; }
    if(o.destinations.indexOf('vimeo')!==-1 ||
       Object.keys(ov).some(function(h){return (ov[h]||[]).indexOf('vimeo')!==-1;}))
      o.vimeo_folder='/users/63409012/projects/30265459';
    outs.push(o);
  });
  return outs;
}
function edProblems(outs){
  var p=[];
  if(!outs.length)p.push('nothing is selected');
  Object.keys(PRESETS).forEach(function(pk){
    PRESETS[pk].rungs.forEach(function(ht){
      var r=ED.rows[edKey(pk,ht)];
      if(r&&r.on&&!r.dests.length)p.push(PRESETS[pk].codec+' '+ht+'p is selected but has no destination');
    });
  });
  return p;
}
function useWithoutSaving(){
  var outs=edOutputs(), probs=edProblems(outs);
  if(probs.length){ document.getElementById('edMsg').innerHTML='<div class="err">'+probs.map(esc).join('<br>')+'</div>'; return; }
  if(ED.target!=null&&BATCHES[ED.target]){ BATCHES[ED.target].outputs=outs; BATCHES[ED.target].profile='__custom__'; }
  closeModal(); drawBatches();
}
function saveProfile(){
  var outs=edOutputs(), probs=edProblems(outs);
  if(!String(ED.name||'').trim())probs.unshift('the preset needs a name');
  if(probs.length){ document.getElementById('edMsg').innerHTML='<div class="err">'+probs.map(esc).join('<br>')+'</div>'; return; }
  fetch('/api/profile/save',{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name:ED.name,outputs:outs})})
   .then(function(r){return r.json();}).then(function(j){
     if(!j.ok){
       document.getElementById('edMsg').innerHTML='<div class="err">'+(j.problems?j.problems.map(esc).join('<br>'):esc(j.error))+'</div>';
       return;
     }
     // Reload the list so the new preset is pickable immediately
     fetch('/api/profiles',{cache:'no-store'}).then(function(r){return r.json();}).then(function(pj){
       if(pj.ok){ PROFILES=pj.profiles; PRESETS=pj.presets; }
       if(ED.target!=null&&BATCHES[ED.target]){ BATCHES[ED.target].profile=j.file; BATCHES[ED.target].outputs=null; }
       closeModal(); drawBatches();
     });
   });
}

function newFolderSave(i){
  var nm=String(NEWF.name||'').trim();

  NEWF.busy=true; NEWF.err=null; drawBatches();

    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({parent:(DESTB.open?DESTB.path:BROWSE.path),name:nm})})
   .then(function(r){return r.json();}).then(function(j){

function isPicked(b,fid){ return b.files.some(function(x){return Number(x.fileid)===Number(fid);}); }
function pick(i,fid,name,on){
  var b=BATCHES[i];
  if(b.dest_folder===undefined)b.dest_folder='encodes';
  if(on){ if(!isPicked(b,fid)){
      var meta=BROWSE.files.filter(function(x){return Number(x.fileid)===Number(fid);})[0]||{};
      b.files.push({fileid:fid,name:name,bytes:meta.size||0}); b.path=BROWSE.path; } }
  else b.files=b.files.filter(function(x){return Number(x.fileid)!==Number(fid);});
  drawBatches();
}
function pickAll(i,on){
  var b=BATCHES[i];
  if(on){ BROWSE.files.forEach(function(f){ if(!isPicked(b,f.fileid)) b.files.push({fileid:f.fileid,name:f.name,bytes:f.size||0}); }); b.path=BROWSE.path; }
  else { var ids=BROWSE.files.map(function(f){return Number(f.fileid);});
         b.files=b.files.filter(function(x){return ids.indexOf(Number(x.fileid))===-1;}); }
  drawBatches();
}

// ---- REVIEW AND SEND
function buildJob(){
  return {
    job_file_version:3,
    job_label:(document.getElementById('jobName').value||'').trim(),
    job_uid:uid(),
    on_existing:'skip',
    dest_subfolder:'encodes',
    batches:BATCHES.map(function(b){
      var p=profileOf(b);
      var _bo={ label:(p?p.name:'batch'), source_path:b.path,
               outputs:outputsOf(b),
               // CARRY THE SIZE. The panel knows it from the browse listing and
               // was discarding it. Without it the daemon has no byte count for
               // a QUEUED film - it only learns the size when it fetches - so
               // the run card could not project remaining time until every film
               // had already been fetched. [MEASURED 2026-08-20, run 30]
               items:b.files.map(function(f){return {fileid:f.fileid,name:f.name,bytes:f.bytes||0};}) };
      // Written ONLY when it differs from the default, so a job using the usual
      // sidecar produces a file identical to what the panel made before this.
      if(b.dest_folder && b.dest_folder!=='encodes'){
        _bo.dest_path_override=(String(b.dest_folder).charAt(0)==='/')
          ? b.dest_folder
          : ((b.path==='/'?'':b.path)+'/'+b.dest_folder);
      }
      return _bo;
    })
  };
}
function review(){
  var job=buildJob();
  var problems=[];
  if(!job.job_label)problems.push('the job needs a name');
  if(!job.batches.length)problems.push('there are no batches');
  job.batches.forEach(function(b,i){
    if(!b.source_path||!b.items.length)problems.push('batch '+(i+1)+' has no files chosen');
  });
  if(problems.length){
    openModal('<h3>Not ready to send</h3><div class="err">'+problems.map(esc).join('<br>')+'</div>');
    return;
  }
  var films=0, outputs=0, bytes=0;
  var h='<h3>'+esc(job.job_label)+'</h3>';
  job.batches.forEach(function(b,i){
    films+=b.items.length;
    var per=0; b.outputs.forEach(function(o){ per+=o.rungs.length; });
    outputs+=per*b.items.length;
    h+='<div style="margin-top:18px"><b>batch '+(i+1)+' &middot; '+esc(b.label)+'</b>'
      +'<div class="muted">'+esc(b.source_path)+'</div>';
    h+='<div class="muted">&#128193; files land in <b>'
      +esc(b.dest_path_override||((b.source_path==='/'?'':b.source_path)+'/encodes'))
      +'</b></div>';
    h+='<div style="margin:9px 0">';
    b.outputs.forEach(function(o){
      outWords(o).split('   ').forEach(function(w){
        h+='<span class="tag b" style="margin-right:8px">'+esc(w)+'</span>';
      });
    });
    h+='</div><table class="rv"><tr><th>file</th><th>outputs each</th></tr>';
    b.items.forEach(function(it){ h+='<tr><td>'+esc(it.name)+'</td><td>'+per+'</td></tr>'; });
    h+='</table></div>';
  });
  h+='<div id="preLine" style="margin-bottom:12px"></div>';
  h+='<div class="sum" id="sumLine">'+films+' file'+(films===1?'':'s')+' in '+job.batches.length+' batch'
    +(job.batches.length===1?'':'es')+', producing about '+outputs+' encoded file'+(outputs===1?'':'s')+'. '
    +'Anything already present at its destination is skipped, so the real number may be lower.'
    +'<div id="estLine" class="muted" style="margin-top:8px">estimating\u2026</div></div>';
  h+='<div style="margin-top:22px;display:flex;gap:11px;flex-wrap:wrap">'
    +'<button class="btn pri" id="bNow" onclick="send(false)">start now</button>'
    +'<button class="btn warn" id="bHold" onclick="send(true)">hold for later</button>'
    +'<button class="btn" id="bPre" onclick="preflight()">preflight check</button>'
    +'<button class="btn" onclick="closeModal()">back</button></div>';
  window.__job=job;
  openModal(h);
  // ESTIMATE. Asked for after the modal is up so a slow answer never delays
  // the review. Shown as a RANGE - the model's mean absolute error against
  // finished runs is 26%, and a single figure would imply a precision that
  // is not there. It answers "one night or three days".
  (function(){
    var fl=[];
    BATCHES.forEach(function(b){
      var codecs=[]; outputsOf(b).forEach(function(o){ if(codecs.indexOf(o.codec)===-1)codecs.push(o.codec); });
      var rungs=[];
      outputsOf(b).forEach(function(o){ (o.rungs||[]).forEach(function(hh){
        rungs.push({codec:o.codec,height:hh}); }); });
      b.files.forEach(function(f){ fl.push({bytes:f.bytes||0,codecs:codecs,rungs:rungs}); });
    });
    fetch('/api/estimate',{method:'POST',cache:'no-store',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({films:fl})})
     .then(function(r){return r.json();}).then(function(j){
       var el=document.getElementById('estLine'); if(!el)return;
       if(!j.ok||!j.seconds){ el.textContent=''; return; }
       el.innerHTML='<b>Estimated run time: '+esc(j.range)+'</b>'
         +' &nbsp;<span class="muted">— from rates measured on this box. '
         +'Skipped files finish instantly, so a run with much already in place lands under the low end.</span>';
     }).catch(function(){ var el=document.getElementById('estLine'); if(el)el.textContent=''; });
  })();
}
function send(hold){
  if(SENDING)return; SENDING=true;
  var bn=document.getElementById('bNow'), bh=document.getElementById('bHold');
  if(bn)bn.disabled=true; if(bh)bh.disabled=true;
  fetch(hold?'/api/job/hold':'/api/job',{method:'POST',cache:'no-store',
    headers:{'Content-Type':'application/json'},body:JSON.stringify(window.__job)})
   .then(function(r){return r.json();}).then(function(j){
     SENDING=false;
     if(j.ok){
       // REPLACE, NOT ADD. The old held file is discarded only after the new
       // one is safely written - if the write had failed we would still have
       // the original. Two near-identical held jobs is exactly the confusion
       // this avoids.
       var was=EDITING;
       var finish=function(){
         openModal('<h3>'+(j.held?'Held':'Started')+'</h3><div class="ok">'+esc(j.message)
           +(was?' The earlier version was replaced.':'')+'</div>'
           +'<div style="margin-top:18px"><button class="btn" onclick="clearJob()">build another</button> '
           +'<a class="btn" href="/" style="text-decoration:none">watch it run &rarr;</a></div>');
         BATCHES=[]; EDITING=null; document.getElementById('jobName').value='';
         drawBatches(); drawEditing(); loadHeld();
       };
       if(was){
         fetch('/api/held/discard/'+encodeURIComponent(was),{cache:'no-store'})
          .then(function(r){return r.json();}).then(finish).catch(finish);
       } else finish();
     } else {
       var msg=j.problems?j.problems.map(esc).join('<br>'):esc(j.error);
       openModal('<h3>Not sent</h3><div class="err">'+msg+'</div>');
     }
   }).catch(function(e){
     SENDING=false;
     openModal('<h3>Not sent</h3><div class="err">no answer from the encoder: '+esc(e.message)+'</div>');
   });
}
// PREFLIGHT - Dr. K, 2026-08-21: "A tired mind during production season may
// forget what was encoded yesterday. No need to do it twice."
// ADVISORY BY RULING. It never disables a button and never blocks a release;
// both remain live while it runs and after it answers.
function n0(v){return v==null?0:Number(v);}
function preflight(){
  var job=window.__job; if(!job)return;
  var el=document.getElementById('preLine'); if(!el)return;
  var btn=document.getElementById('bPre'); if(btn){btn.disabled=true;btn.textContent='checking\u2026';}
  el.innerHTML='<div class="sum">asking pCloud about these films\u2026</div>';
  fetch('/api/preflight',{method:'POST',cache:'no-store',
    headers:{'Content-Type':'application/json'},body:JSON.stringify(job)})
   .then(function(r){return r.json();}).then(function(j){
     if(btn){btn.disabled=false;btn.textContent='preflight check';}
     if(!j.ok){ el.innerHTML='<div class="err">Could not check: '+esc(j.error||'no answer')+'</div>'; return; }
     var t=j.totals||{}, h='';
     var miss=n0(t.missing_sources), present=n0(t.present), todo=n0(t.todo), outs=n0(t.outputs);
     var linked=n0(t.top_rung_likely_linked);
     // THE HEADLINE IS THE ALREADY-ENCODED QUESTION. It is the one a tired mind
     // gets wrong, and the one that costs hours.
     var cls='sum', head='';
     if(miss){
       cls='err';
       head='<b>'+miss+' master'+(miss===1?'':'s')+' could not be found</b> \u2014 moved or renamed since this job was built. '
           +'They will fail when the run reaches them.';
     } else if(todo===0){
       cls='sum'; head='<b>Everything in this job is already delivered.</b> Running it would do no work.';
     } else if(linked && todo===linked){
       cls='sum'; head='<b>'+linked+' output'+(linked===1?'':'s')+' still to make.</b> '
           +'Everything else is already delivered. '+(linked===1?'It is':'They are')+' 1080p H.264 \u2014 a real encode as of 2026-08-23, and the most expensive rung in the ladder.';
     } else if(present){
       cls='sum'; head='<b>'+todo+' of '+outs+' output'+(outs===1?'':'s')+' still to make.</b> '
           +present+' '+(present===1?'is':'are')+' already at the destination and would be skipped.'
           +(linked?' '+linked+' of those '+(linked===1?'is':'are')+' 1080p H.264 \u2014 the most expensive rung in the ladder.':'');
     } else {
       cls='sum'; head='<b>All '+outs+' output'+(outs===1?'':'s')+' still to make.</b> Nothing is at the destination yet.'
           +(linked?' '+linked+' '+(linked===1?'is':'are')+' 1080p H.264 \u2014 the most expensive rung in the ladder.':'');
     }
     h+='<div class="'+cls+'">'+head;
     (j.batches||[]).forEach(function(b){
       h+='<div style="margin-top:9px;font-size:17px">'
         +'<b>'+esc(b.label)+'</b> \u2014 '+b.films+' film'+(b.films===1?'':'s')
         +' \u00b7 '+b.present.length+' already there \u00b7 '+b.todo+' to make';
       if(!b.dest_exists)h+='<div class="muted">the destination folder does not exist yet \u2014 it will be created</div>';
       h+='<div class="muted">'+esc(b.dest_path)+'</div>';
       if(b.missing_sources&&b.missing_sources.length){
         h+='<div class="err" style="margin-top:5px">missing: '+b.missing_sources.map(esc).join(', ')+'</div>';
       }
       if(b.note)h+='<div class="muted" style="margin-top:4px">'+esc(b.note)+'</div>';
       h+='</div>';
     });
     h+='<div class="muted" style="margin-top:10px">This is advice, not a gate \u2014 start or hold as you see fit.</div>';
     h+='</div>';
     el.innerHTML=h;
   }).catch(function(e){
     if(btn){btn.disabled=false;btn.textContent='preflight check';}
     var m=String((e&&e.message)||e||'');
     var netlike=/fetch|network|failed to fetch|load/i.test(m);
     el.innerHTML='<div class="err">'
       +(netlike?'Could not reach the encoder.'
                :'The check answered, but this page could not read it: '+esc(m))
       +'</div>';
     try{ console.error('preflight:',e); }catch(e2){}
   });
}
function clearJob(){ closeModal(); }

// ---- BOOT
fetch('/api/profiles',{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){
  if(j.ok){ PROFILES=j.profiles; PRESETS=j.presets; }
  drawBatches();
}).catch(function(){ drawBatches(); });
loadHeld();
setInterval(loadHeld,10000);
</script></body></html>
